spring.application.name=AduAja
server.port=${PORT:8080}
spring.profiles.active=local

# ==========================================
# THYMELEAF
# ==========================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# ==========================================
# STATIC RESOURCES & FILE UPLOAD
# ==========================================
spring.web.resources.static-locations=classpath:/static/
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:20MB}
server.tomcat.max-http-form-post-size=20MB

# ==========================================
# SUPABASE STORAGE
# ==========================================
supabase.url=${SUPABASE_URL}
supabase.anon-key=${SUPABASE_ANON_KEY}
supabase.bucket=${SUPABASE_BUCKET}

MAIL (Via Brevo HTTP API)
# ==========================================
# Kunci API dari dashboard Brevo (Jangan lupa set di Secrets Hugging Face nanti!)
brevo.api.key=${BREVO_API_KEY}

# Email pengirim yang sudah diverifikasi di Brevo
spring.mail.from=${MAIL_FROM}

# ==========================================
# SECURITY
# ==========================================
spring.security.user.name=${SECURITY_USER_NAME}
spring.security.user.password=${SECURITY_USER_PASSWORD}

# ==========================================
# ==========================================
# DEV MODE (Aktifkan untuk testing/fitur developer)
# ==========================================
app.dev-mode=${DEV_MODE:false}

# SESSION CONFIGURATION (FIX: Logout otomatis)
# ==========================================
# 4 jam session timeout agar warga/admin tidak auto-logout
server.servlet.session.timeout=14400
server.servlet.session.cookie.max-age=14400
server.servlet.session.cookie.http-only=true

# ==========================================
# GOOGLE OAUTH2
# ==========================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.google.user-name-attribute=email
