<html
    lang="id"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/master}"
>
    <th:block layout:fragment="extraHead">
        <title>AduAja - Verifikasi OTP Admin</title>
    </th:block>

    <div layout:fragment="content" class="min-h-screen bg-gray-50 flex items-center justify-center">
        <div class="w-full max-w-md mx-4">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 rounded-full mb-4">
                    <i data-lucide="shield" class="w-8 h-8 text-blue-600"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-900">Verifikasi OTP</h1>
                <p class="text-sm text-gray-600 mt-2">
                    Masukkan kode OTP yang telah dikirim ke email
                </p>
                <p class="text-sm font-semibold text-blue-600 mt-1" th:text="${email}">email@domain.com</p>
            </div>

            <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-8">
                <div
                    th:if="${error}"
                    class="mb-4 p-4 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm"
                    th:text="${error}"
                ></div>

                <form th:action="@{/admin/verify-otp}" method="post" class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2 text-center">
                            Kode OTP 6 Digit
                        </label>
                        <input
                            type="text"
                            name="otpCode"
                            required
                            maxlength="6"
                            pattern="[0-9]{6}"
                            inputmode="numeric"
                            autocomplete="one-time-code"
                            class="w-full text-center text-2xl tracking-[0.5em] px-3 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 font-mono"
                            placeholder="000000"
                        />
                        <p class="text-xs text-gray-500 mt-2 text-center">
                            Kode OTP berlaku selama 10 menit
                        </p>
                    </div>

                    <button
                        type="submit"
                        class="w-full bg-blue-600 text-white py-3 rounded-lg text-sm font-semibold hover:bg-blue-700 transition-colors"
                    >
                        <i data-lucide="check-circle" class="w-4 h-4 inline mr-1"></i>
                        Verifikasi OTP
                    </button>
                </form>

                <div class="mt-6 text-center">
                    <a
                        th:href="@{/admin/login}"
                        class="text-sm text-gray-500 hover:text-gray-700 underline"
                    >
                        Kembali ke Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</html>
