<html
    lang="id"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/master}"
>
    <th:block layout:fragment="extraHead">
        <title>AduAja - Kelola Admin</title>
    </th:block>

    <div layout:fragment="content" class="min-h-screen bg-gray-50">
        <header class="aduaja-header sticky top-0 z-20 border-b">
            <div class="px-6 py-5">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <a
                            th:href="@{/admin/dashboard}"
                            class="aduaja-btn-secondary inline-flex items-center gap-2 text-sm"
                        >
                            <i data-lucide="arrow-left" class="w-4 h-4"></i>
                            Kembali ke Dashboard
                        </a>
                        <div class="ml-4 pl-4 border-l">
                            <h1 class="text-2xl font-bold text-gray-900">
                                Kelola Admin
                            </h1>
                            <p class="text-sm text-gray-600 mt-1">
                                Daftar dan tambah administrator sistem
                            </p>
                        </div>
                    </div>
                    <a
                        th:href="@{/admin/pusat/create-admin}"
                        class="inline-flex items-center gap-2 px-4 py-2.5 bg-blue-600 text-white rounded-lg text-sm font-semibold hover:bg-blue-700 transition-colors"
                    >
                        <i data-lucide="user-plus" class="w-4 h-4"></i>
                        Tambah Admin Baru
                    </a>
                </div>
            </div>
        </header>

        <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div
                th:if="${success}"
                class="mb-4 p-4 bg-green-50 border border-green-200 text-green-700 rounded-lg text-sm"
                th:text="${success}"
            ></div>
            <div
                th:if="${error}"
                class="mb-4 p-4 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm"
                th:text="${error}"
            ></div>

            <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-6">
                <div
                    th:if="${#lists.isEmpty(admins)}"
                    class="text-center py-12 text-gray-400"
                >
                    <i data-lucide="shield" class="w-12 h-12 mx-auto mb-3"></i>
                    <p class="text-sm">Belum ada admin terdaftar</p>
                </div>
                <div
                    th:unless="${#lists.isEmpty(admins)}"
                    class="overflow-x-auto"
                >
                    <table class="w-full text-sm">
                        <thead>
                            <tr class="border-b text-left text-gray-600">
                                <th class="pb-3 font-medium">Nama</th>
                                <th class="pb-3 font-medium">Email</th>
                                <th class="pb-3 font-medium">Role</th>
                                <th class="pb-3 font-medium">Instansi / Wilayah</th>
                                <th class="pb-3 font-medium">Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr
                                th:each="a : ${admins}"
                                class="border-b hover:bg-gray-50"
                            >
                                <td class="py-3 font-medium text-gray-900" th:text="${a.fullName}">Nama</td>
                                <td class="py-3 text-gray-600" th:text="${a.email}">Email</td>
                                <td class="py-3">
                                    <span
                                        class="px-2 py-1 rounded-full text-xs font-medium"
                                        th:classappend="${a.role.name() == 'ADMIN_PUSAT'} ? 'bg-purple-100 text-purple-700' : 'bg-teal-100 text-teal-700'"
                                        th:text="${a.role.name() == 'ADMIN_PUSAT'} ? 'Admin Pusat' : 'Admin Dinas'"
                                    >Admin</span>
                                </td>
                                <td class="py-3 text-gray-600">
                                    <span th:if="${a.agency != null}" th:text="${a.agency.agencyName}">-</span>
                                    <span th:if="${a.region != null}" th:text="${a.region.regionName}">-</span>
                                    <span th:if="${a.agency == null and a.region == null}" class="text-gray-400">-</span>
                                </td>
                                <td class="py-3">
                                    <span
                                        class="px-2 py-1 rounded-full text-xs font-medium"
                                        th:classappend="${a.accountStatus.name() == 'ACTIVE'} ? 'bg-green-100 text-green-700' : (${a.accountStatus.name() == 'PENDING'} ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-700')"
                                        th:text="${a.accountStatus.name() == 'ACTIVE'} ? 'Aktif' : (${a.accountStatus.name() == 'PENDING'} ? 'Menunggu' : 'Nonaktif')"
                                    >Active</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</html>
